<!DOCTYPE html>

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="description" content="Omar Palomares Velasco — desarrollador de sistemas y software: sistema operativo, lenguaje con compilador propio y software de escritorio real en Rust." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Omar Palomares Velasco — Desarrollador de sistemas y software" />
    <meta property="og:description" content="Sistema operativo propio, un lenguaje con compilador propio y software de escritorio real en Rust. Ingeniería en Computación — UAEM, Valle de Chalco." />
    <meta property="og:site_name" content="Omar Palomares Velasco" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:locale:alternate" content="en_US" />
    <!-- Al desplegar: og:url y og:image deben ser URL ABSOLUTAS del dominio final.
         %PUBLIC_URL% es relativo hasta que se defina PUBLIC_URL en el build. -->
    <meta property="og:image" content="%PUBLIC_URL%/images/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Portada del portafolio de Omar Palomares Velasco: nombre, descripción y el escritorio real de Portix OS." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Omar Palomares Velasco — Desarrollador de sistemas y software" />
    <meta name="twitter:description" content="Sistema operativo propio, un lenguaje con compilador propio y software de escritorio real en Rust." />
    <meta name="twitter:image" content="%PUBLIC_URL%/images/og.png" />
    <meta name="author" content="Omar Palomares Velasco" />
    <script>
      (function () {
        var theme = 'phosphor';
        try {
          var saved = window.localStorage.getItem('portfolio-theme');
          if (saved === 'amber' || saved === 'cyan' || saved === 'graphite') theme = saved;
        } catch (error) {}
        var colors = { phosphor: '#0b0f0d', amber: '#120e08', cyan: '#071013', graphite: '#101012' };
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', colors[theme]);
      })();
    </script>
    <link rel="preload" as="image" href="%PUBLIC_URL%/images/project-portix-real.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" href="/fonts/space-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin /><link rel="preload" href="/fonts/jetbrains-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin /><link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
